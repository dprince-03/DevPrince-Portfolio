# Brute-force guard for auth endpoints, in addition to whatever the app does.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

upstream client_upstream {
  server client:3000;
}

upstream server_upstream {
  server server:5000;
}

# --- HTTP ---------------------------------------------------------------
# Serves the app directly over plain HTTP for now. Once the SSL cert below
# is issued and installed, come back and turn this into a redirect-only
# block (see the HTTPS section's instructions).
server {
  listen 80;
  server_name techprince.name.ng www.techprince.name.ng;

  # Let's Encrypt/certbot webroot validation, if that's ever used later.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Truehost/Sectigo (AskSSL) manual domain validation. Drop the exact
  # validation file Truehost's client area gives you into
  # infra/nginx/pki-validation/ on the VPS (filename and content must match
  # exactly what Truehost shows — same file works for both the root domain
  # and the www SAN, no need to duplicate it).
  location /.well-known/pki-validation/ {
    root /var/www/pki-validation;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  include /etc/nginx/app-locations.conf;
}

