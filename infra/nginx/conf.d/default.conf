# Brute-force guard for auth endpoints, in addition to whatever the app does.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

upstream client_upstream {
  server client:3000;
}

upstream server_upstream {
  server server:5000;
}

# --- HTTP -----------------------------------------------------------------
# Only serves the two validation paths (needed for the initial cert and any
# future renewal); everything else redirects straight to HTTPS.
server {
  listen 80;
  server_name techprince.name.ng www.techprince.name.ng;

  # Let's Encrypt/certbot webroot validation, if that's ever used later.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Truehost/Sectigo (AskSSL) manual domain validation. Drop the exact
  # validation file Truehost's client area gives you into
  # infra/nginx/pki-validation/ on the VPS (filename and content must match
  # exactly what Truehost shows — same file works for both the root domain
  # and the www SAN, no need to duplicate it). alias, not root: it strips
  # the /.well-known/pki-validation/ prefix instead of appending the full
  # request path to it, matching how the file is actually placed (flat, no
  # nested .well-known/pki-validation/ subfolder on disk).
  location /.well-known/pki-validation/ {
    alias /var/www/pki-validation/;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# --- HTTPS ------------------------------------------------------------------
server {
  listen 443 ssl;
  http2 on;
  server_name techprince.name.ng www.techprince.name.ng;

  ssl_certificate     /etc/nginx/ssl/techprince.name.ng/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/techprince.name.ng/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=63072000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  include /etc/nginx/app-locations.conf;
}
