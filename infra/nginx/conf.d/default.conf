# Brute-force guard for auth endpoints, in addition to whatever the app does.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

upstream client_upstream {
  server client:3000;
}

upstream server_upstream {
  server server:5000;
}

# --- HTTP ---------------------------------------------------------------
server {
  listen 80;
  # Replace with your real domain once one is chosen (see docs/PLAN.md
  # roadmap: "Deployment target decision"). "_" matches any Host header.
  server_name _;

  # Required for Let's Encrypt/certbot webroot validation once HTTPS is set up.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/auth/ {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://server_upstream;
    include /etc/nginx/proxy_params.conf;
  }

  location /api/ {
    proxy_pass http://server_upstream;
    include /etc/nginx/proxy_params.conf;
  }

  location / {
    proxy_pass http://client_upstream;
    include /etc/nginx/proxy_params.conf;
  }

  # Next.js static assets are content-hashed and safe to cache aggressively.
  location /_next/static/ {
    proxy_pass http://client_upstream;
    include /etc/nginx/proxy_params.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}

