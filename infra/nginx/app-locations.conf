# Shared proxy locations, included from both the HTTP and HTTPS server
# blocks in conf.d/default.conf so they don't have to be kept in sync by hand.

location /api/auth/ {
  limit_req zone=auth_limit burst=5 nodelay;
  proxy_pass http://server_upstream;
  include /etc/nginx/proxy_params.conf;
}

location /api/ {
  proxy_pass http://server_upstream;
  include /etc/nginx/proxy_params.conf;
}

location / {
  proxy_pass http://client_upstream;
  include /etc/nginx/proxy_params.conf;
}

# Next.js static assets are content-hashed and safe to cache aggressively.
location /_next/static/ {
  proxy_pass http://client_upstream;
  include /etc/nginx/proxy_params.conf;
  add_header Cache-Control "public, max-age=31536000, immutable";
}
