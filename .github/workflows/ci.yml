name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devprince
          POSTGRES_PASSWORD: devprince
          POSTGRES_DB: devprince_portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devprince -d devprince_portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://devprince:devprince@localhost:5432/devprince_portfolio?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-real
      COOKIE_SECURE: "false"
      CLIENT_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx prisma migrate deploy
      - name: Boot smoke test
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:5000/api/health
          kill $SERVER_PID
